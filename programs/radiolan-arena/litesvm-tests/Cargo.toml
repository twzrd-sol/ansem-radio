[package]
name = "radiolan-arena-litesvm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-only LiteSVM tests for radiolan-arena against the Token-2022 program LiteSVM ships with"

[dev-dependencies]
litesvm = { version = "0.10" }
solana-sdk = "=2.2.1"
solana-account = "=3.4.0"
solana-address = "=2.2.0"
solana-instruction = "=3.2.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
solana-system-interface = "1.0"
solana-clock = "=3.1.0"
serde_json = "1"
base64 = "0.22"
